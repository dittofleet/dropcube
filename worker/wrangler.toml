name = "dropcube"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dropcube"

# Kept files live here, away from the lifecycle rule on the bucket above.
[[r2_buckets]]
binding = "KEEP"
bucket_name = "dropcube-keep"
